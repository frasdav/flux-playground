---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: flux-operator
  namespace: kube-system
spec:
  chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  version: "0.58.1"
  targetNamespace: flux-system
  createNamespace: true
  bootstrap: true
  timeout: 5m
  backOffLimit: 3
  failurePolicy: abort
  valuesContent: |
    installCRDs: true
    web:
      enabled: false
