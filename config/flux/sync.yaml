---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: playground
  namespace: flux-system
spec:
  interval: 1m
  timeout: 1m
  url: oci://k3d-flux-playground-registry:5000/flux-playground/manifests
  ref:
    tag: dev
  insecure: true
  provider: generic
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: playground
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: playground
  path: ./clusters/local
